namespace: webapp

image:
  repository: kanimozhimurugesan197/library-management-system
  tag: "sqlite-final-1"
  pullPolicy: Always

service:
  type: NodePort
  port: 8000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    path: /healthz
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

startupProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

mysql:
  image: "mysql:8.0"
  storageClassName: "local-path"
  storageSize: 5Gi
  database: "mydb"
  username: "N01683837W25"
  password: "Toronto@2024"
  rootPassword: "rootpassword"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
