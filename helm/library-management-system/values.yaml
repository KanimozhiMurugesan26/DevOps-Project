namespace: webapp

image:
  repository: kanimozhimurugesan197/library-management-system
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

probes:
  liveness:
    path: /
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 10

