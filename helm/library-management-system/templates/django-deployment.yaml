apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "library-management-system.fullname" . }}-django
  labels:
    app: {{ include "library-management-system.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "library-management-system.name" . }}
      tier: django
  template:
    metadata:
      labels:
        app: {{ include "library-management-system.name" . }}
        tier: django
    spec:
      containers:
        - name: django
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          ports:
            - containerPort: 8000
          env:
            - name: DB_NAME
              value: {{ .Values.mysql.database | quote }}
            - name: DB_USER
              value: {{ .Values.mysql.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "library-management-system.fullname" . }}-mysql
                  key: db-password
            - name: DB_HOST
              value: {{ printf "%s-mysql" (include "library-management-system.fullname" .) | quote }}
            - name: DB_PORT
              value: "3306"
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: 8000
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: 8000
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
