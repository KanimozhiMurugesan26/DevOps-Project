cat > helm/library-management-system/templates/mysql-secret.yaml <<'YAML'
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library-management-system.fullname" . }}-mysql
type: Opaque
stringData:
  db-password: {{ .Values.mysql.password | quote }}
  root-password: {{ .Values.mysql.rootPassword | quote }}
YAML

